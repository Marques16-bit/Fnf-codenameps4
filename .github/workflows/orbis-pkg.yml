name: Gerar PKG (PS4)

on:
  workflow_dispatch:
    inputs:
      jogo:
        description: Marque para compilar o Codename Engine (desmarcado = teste hello)
        type: boolean
        default: false

env:
  HAXE_VERSION: 4.3.7
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
  DOTNET_ROLL_FORWARD: LatestMajor

jobs:
  pkg:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Instalar Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Instalar clang, lld e llvm
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make curl unzip

      - name: Baixar o OpenOrbis Toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/oo"
          cd "$HOME/oo"
          gh release download --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern "*.tar.gz"
          for f in *.tar.gz; do tar -xzf "$f"; done
          LINKX="$(find "$HOME/oo" -name link.x | head -n1)"
          if [ -z "$LINKX" ]; then
            echo "link.x nao encontrado no toolchain baixado"
            ls -R "$HOME/oo" | head -60
            exit 1
          fi
          TC="$(dirname "$LINKX")"
          chmod -R +x "$TC/bin/linux" || true
          echo "OO_PS4_TOOLCHAIN=$TC" >> "$GITHUB_ENV"

      - name: hello - instalar hxcpp
        if: inputs.jogo == false
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"
          haxelib install hxcpp --quiet

      - name: hello - compilar e empacotar
        if: inputs.jogo == false
        env:
          HXCPP_VERBOSE: 1
        run: |
          bash orbis/scripts/00-check.sh
          bash orbis/scripts/01-install-toolchain.sh
          bash orbis/scripts/03-build-hello.sh

      - name: jogo - bibliotecas Haxe e Lime do engine
        if: inputs.jogo == true
        run: |
          haxelib --global update haxelib
          haxe -cp commandline -D analyzer-optimize --run Main setup -si
          haxelib run lime setup -alias -y -nocffi
          haxelib run lime rebuild hxcpp
          haxelib run lime rebuild tools

      - name: jogo - toolchain orbis do hxcpp
        if: inputs.jogo == true
        run: |
          bash orbis/scripts/00-check.sh
          bash orbis/scripts/01-install-toolchain.sh

      - name: jogo - Lime nativo para orbis
        if: inputs.jogo == true
        run: haxelib run lime rebuild linux -Dorbis -Dstatic_link -DHXCPP_M64 -nocolor -release

      - name: jogo - compilar e empacotar
        if: inputs.jogo == true
        run: bash orbis/scripts/04-build-game.sh

      - name: Enviar so o pkg
        uses: actions/upload-artifact@v4
        with:
          name: fnf-ps4-pkg
          path: orbis/pkg/dist/*.pkg
          if-no-files-found: error
          retention-days: 14
