name: Gerar PKG (PS4)

# So gera o .pkg e deixa em Artifacts (nome: fnf-ps4-pkg). Assets e mods nao vao no pacote:
# copie por FTP para /data/FNF/assets e /data/FNF/Mods.
#   alvo = hello : teste do hxcpp no PS4 (roda ja hoje)
#   alvo = jogo  : Codename Engine (falha ate existir o backend nativo do Lime para orbis)

on:
  workflow_dispatch:
    inputs:
      alvo:
        description: "hello = teste do hxcpp | jogo = Codename Engine"
        type: choice
        options:
          - hello
          - jogo
        default: hello

env:
  HAXE_VERSION: 4.3.7
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
  DOTNET_ROLL_FORWARD: LatestMajor

jobs:
  pkg:
    name: PKG ${{ inputs.alvo }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v7

      - name: Instalar Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Instalar clang, lld e llvm
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make curl unzip

      - name: Baixar o OpenOrbis Toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/oo" && cd "$HOME/oo"
          gh release download --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern "*.tar.gz"
          for f in *.tar.gz; do tar -xzf "$f"; done
          LINKX="$(find "$HOME/oo" -name link.x | head -n1)"
          if [ -z "$LINKX" ]; then
            echo "link.x nao encontrado no toolchain baixado:"
            ls -R "$HOME/oo" | head -60
            exit 1
          fi
          TC="$(dirname "$LINKX")"
          chmod -R +x "$TC/bin/linux" || true
          echo "OO_PS4_TOOLCHAIN=$TC" >> "$GITHUB_ENV"
          echo "Toolchain em: $TC"

      # ---------- alvo hello ----------
      - name: hello - instalar hxcpp
        if: ${{ inputs.alvo == hello }}
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"
          haxelib install hxcpp --quiet

      - name: hello - compilar e empacotar
        if: ${{ inputs.alvo == hello }}
        run: |
          bash orbis/scripts/00-check.sh
          bash orbis/scripts/01-install-toolchain.sh
          bash orbis/scripts/02-build-hxcpp-libs.sh
          bash orbis/scripts/03-build-hello.sh

      # ---------- alvo jogo ----------
      - name: jogo - aviso
        if: ${{ inputs.alvo == jogo }}
        run: echo "::warning::O Lime ainda nao tem backend nativo para orbis; este alvo deve falhar no link. Os logs servem para a fase 2."

      - name: jogo - bibliotecas Haxe/Lime do engine
        if: ${{ inputs.alvo == jogo }}
        run: |
          haxelib --global update haxelib
          haxe -cp commandline -D analyzer-optimize --run Main setup -si
          haxelib run lime setup -alias -y -nocffi
          haxelib run lime rebuild hxcpp
          haxelib run lime rebuild tools

      - name: jogo - toolchain orbis e libs do hxcpp
        if: ${{ inputs.alvo == jogo }}
        run: |
          bash orbis/scripts/00-check.sh
          bash orbis/scripts/01-install-toolchain.sh
          bash orbis/scripts/02-build-hxcpp-libs.sh

      - name: jogo - Lime nativo para orbis
        if: ${{ inputs.alvo == jogo }}
        run: haxelib run lime rebuild linux -Dorbis -Dstatic_link -DHXCPP_M64 -nocolor -release

      - name: jogo - compilar e empacotar
        if: ${{ inputs.alvo == jogo }}
        run: bash orbis/scripts/04-build-game.sh

      # ---------- saida ----------
      - name: Enviar so o .pkg
        uses: actions/upload-artifact@v7
        with:
          name: fnf-ps4-pkg
          path: orbis/pkg/dist/*.pkg
          if-no-files-found: error
          retention-days: 14
