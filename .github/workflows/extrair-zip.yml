name: Extrair ZIP na raiz

on:
  workflow_dispatch:
  push:
    paths:
      - repo.zip

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Extrair repo.zip por cima da raiz
        run: |
          if [ ! -f repo.zip ]; then
            echo "Nao achei repo.zip na raiz. Nada a fazer."
            exit 0
          fi
          T="$(mktemp -d)"
          unzip -q -o repo.zip -d "$T"
          SRC="$T"
          if [ "$(ls -A "$T" | wc -l)" -eq 1 ]; then
            ONE="$T/$(ls -A "$T")"
            if [ -d "$ONE" ]; then SRC="$ONE"; fi
          fi
          rm -rf "$SRC/.git"
          cp -a "$SRC"/. .
          rm -f repo.zip

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Extrair repo.zip"
            git push
          fi
